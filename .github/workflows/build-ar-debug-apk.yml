name: Build Bigimong AR debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.12-offline-beta

permissions:
  contents: read

concurrency:
  group: bigimong-ar-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run regression tests
        run: npm test

  build:
    name: Build ARM64 development APK
    needs: verify
    # GameCI v4 enableGpu omits -nographics on macOS only. Rendering checks are mandatory.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Unity Personal secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for variable in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is not configured in repository Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/BigimongAR/Library
          key: unity-${{ runner.os }}-${{ runner.arch }}-6000.0.58f2-android-${{ hashFiles('unity/BigimongAR/Packages/**', 'unity/BigimongAR/ProjectSettings/**') }}
          restore-keys: |
            unity-${{ runner.os }}-${{ runner.arch }}-6000.0.58f2-android-

      - name: Build Bigimong AR APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.58f2
          projectPath: unity/BigimongAR
          buildMethod: Bigimong.Editor.BigimongAndroidBuild.BuildDebugApk
          versioning: None
          enableGpu: true

      - name: Set up Node.js for APK verification
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for APK inspection
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android APK inspection tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Verify APK contract
        shell: bash
        run: |
          node scripts/verify-apk.mjs \
            --apk build/Android/Bigimong-AR-v0.19-debug.apk \
            --report build/Android/Bigimong-AR-v0.19-verification.json
          shasum -a 256 build/Android/Bigimong-AR-v0.19-debug.apk \
            > build/Android/Bigimong-AR-v0.19-debug.apk.sha256

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bigimong-AR-v0.19-debug
          path: |
            build/Android/Bigimong-AR-v0.19-debug.apk
            build/Android/Bigimong-AR-v0.19-verification.json
            build/Android/Bigimong-AR-v0.19-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Collect Unity build diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build/diagnostics
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "unity_version=6000.0.58f2"
            echo "project_path=unity/BigimongAR"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "graphics_required=true"
            echo "gameci_enable_gpu=true"
          } > build/diagnostics/context.txt
          for candidate in \
            unity/BigimongAR/Editor.log \
            unity/BigimongAR/build.log \
            "$HOME/Library/Logs/Unity/Editor.log" \
            "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "build/diagnostics/$(basename "$candidate")"
            fi
          done

      - name: Upload Unity failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bigimong-AR-v0.19-build-logs
          path: build/diagnostics
          if-no-files-found: error
          retention-days: 14
