name: Build Bigimong AR debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigimong-ar-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run regression tests
        run: npm test

  build:
    name: Build ARM64 development APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Unity Personal secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for variable in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is not configured in repository Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/BigimongAR/Library
          key: unity-6000.0.58f2-android-${{ hashFiles('unity/BigimongAR/Packages/**', 'unity/BigimongAR/ProjectSettings/**') }}
          restore-keys: |
            unity-6000.0.58f2-android-

      - name: Build Bigimong AR APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.58f2
          projectPath: unity/BigimongAR
          buildMethod: Bigimong.Editor.BigimongAndroidBuild.BuildDebugApk
          versioning: None

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bigimong-AR-v0.11-debug
          path: build/Android/Bigimong-AR-v0.11-debug.apk
          if-no-files-found: error
          retention-days: 14
